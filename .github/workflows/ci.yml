name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call: # reused by release.yml so releases run the exact same gate

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ytp.sln

      - name: Build
        run: dotnet build ytp.sln -c Release --no-restore

  snapshot:
    name: Snapshot build (linux-x64)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: scripts/publish linux-x64 "0.0.0-ci.${{ github.run_number }}+${GITHUB_SHA::7}"

      - uses: actions/upload-artifact@v4
        with:
          name: ytp-linux-x64-snapshot
          path: artifacts/linux-x64/
          retention-days: 14
