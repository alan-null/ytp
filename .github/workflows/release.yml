name: Release

on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: Publish GitHub release
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the release + upload assets
    env:
      RIDS: linux-x64 linux-arm64
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Publish
        run: for rid in $RIDS; do scripts/publish "$rid" "$VERSION"; done

      - name: Package
        run: scripts/package "$VERSION" $RIDS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--title "$GITHUB_REF_NAME" --generate-notes --verify-tag)
          [[ "$VERSION" == *-* ]] && flags+=(--prerelease)   # v1.2.0-rc.1 -> prerelease, never "latest"
          gh release create "$GITHUB_REF_NAME" dist/* "${flags[@]}"
